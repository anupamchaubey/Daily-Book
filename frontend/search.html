<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search & Explore — DailyBook</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header"></header>

    <main class="main-content">
      <div class="container" style="max-width: 860px;">
        
        <!-- Search Bar Hero -->
        <div style="margin-bottom: 36px;">
          <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 16px;">
            Search Stories
          </h1>

          <form id="search-form" style="position: relative; display: flex; align-items: center;">
            <div style="position: absolute; left: 18px; color: var(--text-muted); display: flex; align-items: center; pointer-events: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <input 
              type="text" 
              id="search-main-input" 
              class="form-input" 
              placeholder="Search by title, topic, or keyword..." 
              style="font-size: 1.0625rem; height: 54px; padding: 0 48px 0 52px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);"
              autofocus
            />
            <button 
              type="button" 
              id="search-clear-btn" 
              style="display: none; position: absolute; right: 18px; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;"
              aria-label="Clear search input"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            </button>
          </form>
        </div>

        <!-- Result Stats / Metadata -->
        <div id="search-results-header"></div>

        <!-- Results List -->
        <div id="search-results-container">
          <!-- Populated by search.js -->
        </div>

        <!-- Search Pagination -->
        <div id="search-pagination"></div>

      </div>
    </main>

    <footer class="site-footer"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.renderHeader('search');
      App.renderFooter();
      searchController.init();
    });
  </script>
</body>
</html>
