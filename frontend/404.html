<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — DailyBook</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header"></header>

    <main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--nav-height) - 120px);">
      <div class="container" style="text-align: center; max-width: 540px; padding: 48px 20px;">
        <div style="font-size: 5rem; font-weight: 800; letter-spacing: -0.05em; color: var(--accent); line-height: 1; margin-bottom: 16px;">
          404
        </div>
        <h1 style="font-size: 1.85rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px;">
          This story seems to be missing
        </h1>
        <p style="font-size: 1rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 28px;">
          The page or article you are looking for doesn't exist, has been removed, or requires specific permissions to view.
        </p>
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
          <a href="feed.html" class="btn btn-primary">Go to Feed</a>
          <a href="index.html" class="btn btn-secondary">Home</a>
        </div>
      </div>
    </main>

    <footer class="site-footer"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.renderHeader();
      App.renderFooter();
    });
  </script>
</body>
</html>
