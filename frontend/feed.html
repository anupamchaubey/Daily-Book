<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — DailyBook</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header"></header>

    <main class="main-content">
      <div class="container">

        <!-- Guest Notice Banner (visible if viewing without being logged in) -->
        <div id="guest-feed-banner" style="display: none; background: var(--bg-surface); border: 1px solid var(--accent-border); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: var(--radius-md); margin-bottom: 24px;">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: gap; gap: 12px;">
            <div>
              <strong style="color: var(--text-primary);">You're viewing public stories.</strong>
              <span style="color: var(--text-secondary); margin-left: 6px;">Sign in to follow writers and build your personalized feed.</span>
            </div>
            <div style="display: flex; gap: 8px;">
              <a href="login.html?redirect=feed.html" class="btn btn-primary btn-sm">Sign In</a>
              <a href="register.html" class="btn btn-outline btn-sm">Register</a>
            </div>
          </div>
        </div>

        <!-- 70/30 Feed Layout -->
        <div class="feed-layout" style="display: grid; grid-template-columns: 1fr 340px; gap: 40px; align-items: start;">
          
          <!-- Main Content Column (~70%) -->
          <div class="feed-main-stream">
            <!-- Tabs / Mode Bar -->
            <div class="tabs-nav" style="margin-bottom: 28px;">
              <button class="tab-btn active" id="tab-feed-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/></svg>
                Your Timeline
              </button>
              <button class="tab-btn" id="tab-explore-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                Explore Public
              </button>
            </div>

            <!-- Feed Post List Container -->
            <div id="feed-posts-container">
              <!-- Skeletons rendered by feed.js -->
            </div>

            <!-- Feed Pagination -->
            <div id="feed-pagination"></div>
          </div>

          <!-- Sidebar Column (~30%) -->
          <aside class="feed-sidebar" style="position: sticky; top: calc(var(--nav-height) + 24px); display: flex; flex-direction: column; gap: 24px;">
            <!-- User Mini Profile / Welcome Card -->
            <div id="feed-sidebar-profile"></div>

            <!-- Search Quick Card -->
            <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px;">
              <h4 style="font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 12px;">Discover Stories</h4>
              <div style="position: relative;">
                <input 
                  type="text" 
                  id="sidebar-search-input" 
                  class="form-input" 
                  placeholder="Search keywords..." 
                  style="font-size: 0.875rem; padding-right: 36px;"
                />
                <button 
                  id="sidebar-search-btn" 
                  style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;"
                  aria-label="Search"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
              </div>
            </div>

            <!-- Philosophy Mini Card -->
            <div style="background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 20px; font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5;">
              <strong style="color: var(--text-primary); display: block; margin-bottom: 6px;">DailyBook Philosophy</strong>
              A sanctuary for thoughtful expression. No algorithmic feeds, no vanity metrics. Just pure words and ideas between authors and readers.
            </div>
          </aside>

        </div>
      </div>
    </main>

    <footer class="site-footer"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/feed.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.renderHeader('feed');
      App.renderFooter();
      feedController.init();

      // Sidebar quick search
      const sideInput = document.getElementById('sidebar-search-input');
      const sideBtn = document.getElementById('sidebar-search-btn');
      const doSearch = () => {
        if (sideInput && sideInput.value.trim()) {
          window.location.href = `search.html?q=${encodeURIComponent(sideInput.value.trim())}`;
        }
      };
      if (sideBtn) sideBtn.addEventListener('click', doSearch);
      if (sideInput) sideInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    });
  </script>
</body>
</html>
