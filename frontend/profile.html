<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — DailyBook</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header"></header>

    <main class="main-content">
      <div class="container" style="max-width: 900px;">
        
        <!-- Profile Header Container -->
        <div id="profile-header-container">
          <!-- Populated by profile.js -->
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs-nav" style="margin-bottom: 24px;">
          <button class="tab-btn active" id="tab-posts-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/></svg>
            Stories
          </button>
          <button class="tab-btn" id="tab-followers-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Followers
          </button>
          <button class="tab-btn" id="tab-following-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
            Following
          </button>
        </div>

        <!-- Tab Content Container -->
        <div id="profile-content-container">
          <!-- Populated by profile.js -->
        </div>

        <!-- Pagination -->
        <div id="profile-pagination"></div>

      </div>
    </main>

    <footer class="site-footer"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.renderHeader('profile');
      App.renderFooter();
      profileController.init();
    });
  </script>
</body>
</html>
